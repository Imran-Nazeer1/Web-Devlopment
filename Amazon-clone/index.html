<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="nav-logo ">
                <div class="logo border"></div>
            </div>
            <div class="nav-address border">
                <p class="first-address">Delivering to</p>
                <div class="address-icon">
                    <i class="fa-sharp fa-solid fa-location-dot"></i>
                    <p>Update location</p>
                </div>
            </div>
            <div class="search-icon">
                <select>
                    <option>All</option>
                </select>
                <input type="text" placeholder="Search Amazon.in" class="search">
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="sign">
                <span class="sign-span">Hello, sign in</span>
                <p>Accounts & Lists</p>
            </div>

            <div class="Return border">
                <span class="sign-span">Returns</span>
                <p class="return-p">& Orders</p>
            </div>
        </div>
    </header>

    <main>
        <div class="hero-section"></div>
    </main>
</body>

</html>
