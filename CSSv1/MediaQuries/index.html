<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .con{
            height: 345px;
            width: 345px;
            border: 2px solid red;
        }
        @media  (min-width:347px){
            .con{
                background-color: black;
            }
        }
    </style>
</head>
<body>
    <div class="con">
        hi
    </div>
</body>
</html>
