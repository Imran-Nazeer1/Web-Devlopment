<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .box{
            width: 50px;
            height: 50px;
            border: 2px solid black;
            background-color: beige;
            transform: translate(-50% , -50%);
        }
        .container{
            width: 80vw;
            height: 80vh;
            border: 2px solid purple;
            /* background-color: beige; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
